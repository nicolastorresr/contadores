s:["Slang",{r:["Reacciones","<b>Patrón:</b> reacciones cortas, sin です/ます. El tono lo es todo: <i>やばい</i> puede ser elogio o desastre."],o:["Opiniones","<b>Patrón:</b> casi todos son adjetivos い y conjugan igual: うざい → うざかった / うざくない. <span class='w'>Borde:</span> 微妙 y 大丈夫 cambian de sentido según el contexto."],a:["Abreviaturas","<b>Patrón:</b> recorte de 2 moras + 2 moras (あけましておめでとう → <i>あけおめ</i>; スマートフォン → <i>スマホ</i>). Típico de chat y SNS."],f:["Fin de frase","<b>Patrón:</b> contracciones del habla: では→<i>じゃ</i>, でしょ→<i>っしょ</i>, ～てしまう→<i>～ちゃう</i> (～んでしまう→<i>～じゃう</i>), です→<i>っす</i>."]},"Slang: úsalo con amigos, no con jefes ni en textos formales."],

n:["Números",{b:["Básicos 0–10","<b>Patrón:</b> 1 いち · 2 に · 3 さん · 5 ご · 6 ろく · 8 はち · 10 じゅう. <span class='w'>Bordes:</span> 0, 4, 7 y 9 tienen dos lecturas."],d:["Decenas y centenas","<b>Patrón:</b> 11 = 十 + 一; 20 = 二 + 十; 100 = ひゃく (sin いち). <span class='w'>Bordes:</span> 300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく."],g:["Miles y grandes","<b>Patrón:</b> se agrupa de a 4 dígitos (万, 億). <span class='w'>Bordes:</span> 一万 requiere いち; 3000 さんぜん; 8000 はっせん."],e:["Casos especiales","<b>Patrón:</b> en teléfonos y fracciones se lee dígito a dígito. <span class='w'>Borde:</span> fracción al revés: ‘de 3 partes, 1’ = さんぶんの いち."]},"Los números chinos (いち, に…) se combinan con casi todo; los nativos (ひとつ…) solo hasta 10."],
d:["Fechas",{m:["Meses","<b>Patrón:</b> N + 月 (がつ). <span class='w'>Bordes:</span> 4月 しがつ (nunca よんがつ), 7月 しちがつ, 9月 くがつ."],y:["Días del mes","<b>Patrón:</b> 1–10 son nativos y hay que memorizarlos; 11+ es N + にち. <span class='w'>Bordes:</span> 1 ついたち, 14 y 24 よっか, 20 はつか."],s:["Días de semana","<b>Patrón:</b> elemento + 曜日: 日 sol, 月 luna, 火 fuego, 水 agua, 木 madera, 金 oro, 土 tierra."],r:["Relativos","<b>Patrón:</b> casi todos tienen lectura propia, no se deducen de los kanji. <span class='w'>Bordes:</span> 今日 きょう, 昨日 きのう, 明日 あした, 今年 ことし."]},"Ojo: <b>20 días</b> es はつか, pero <b>20 años</b> es はたち. Son homónimos de la misma raíz, pero se usan por separado."],
t:["Hora",{h:["Horas","<b>Patrón:</b> N + 時 (じ). <span class='w'>Bordes:</span> 4時 よじ, 7時 しちじ, 9時 くじ."],m:["Minutos","<b>Patrón ふん/ぷん:</b> con 2, 5, 7, 9 → ふん. Con 1, 3, 4, 6, 8, 10 → ぷん (con っ en 1, 6, 8, 10). <span class='w'>Borde:</span> 4分 = よんぷん."],e:["Expresiones","<b>Patrón:</b> 午前/午後 van antes de la hora; ～ごろ = aproximadamente; ～ちょうど = en punto."],d:["Duración","<b>Patrón:</b> N + 時間 (horas de duración). <span class='w'>Bordes:</span> 4時間 よじかん, 7時間 しちじかん, 9時間 くじかん."]},"Hora = N時 + N分. La media hora es 半 (はん), el cuarto se dice 15分."]};

const JW=t=>String(t).replace(/[\u3040-\u30ff\u3400-\u9fff々〜～ー・]+/g,'<span class="jp">$&</span>');

const R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa o n ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po".split(" ");
function ro(t){const s=[...t].map(c=>c>="ァ"&&c<="ヶ"?String.fromCharCode(c.charCodeAt(0)-96):c);let o="",g=0;
 for(let i=0;i<s.length;i++){const c=s[i];if(c=="っ"){g=1;continue}if(c=="ー"){o+=o.slice(-1);continue}
  const j=H.indexOf(c);if(j<0){o+=c;continue}let r=R[j];const y="ゃゅょ".indexOf(s[i+1]);
  if(y>=0){const v="aou"[y];r=["shi","chi","ji"].includes(r)?r.slice(0,-1)+v:r.slice(0,-1)+"y"+v;i++}
  if(g){r=(r[0]=="c"?"t":r[0])+r;g=0}o+=r}return o}
const $=id=>document.getElementById(id);
let sec="s",cur="all";
const grp=()=>D.filter(d=>d.s==sec&&(cur=="all"||d.c==cur));

 <p><span class="lb">PATRÓN / LECTURAS</span><br>${JW(d.n)}</p><p><span class="lb">EJEMPLO</span><br><span class="ex jp">${d.e}</span><br><i>${d.r}</i><br>${d.t}</p></div></div></div>`).join("");
 document.querySelectorAll(".c").forEach(c=>c.onclick=()=>c.classList.toggle("fl"));
}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let Q=[],i=0,sc=0;

function ask(){
 const q=Q[i],pool=D.filter(d=>d.s==sec&&d!=q),near=shuf(pool.filter(d=>d.c==q.c)),far=shuf(pool.filter(d=>d.c!=q.c)),cand=[...near,...far];
 const kind=i%3==1&&q.h!=q.k?"r":i%3==2?"j":"m";let ans,title,show,opts,key;
 if(kind=="r"){title="¿Cómo se lee?";show=q.k;key=d=>d.h;ans=q.h}

 else{title="¿Qué significa?";show=q.k;key=d=>d.m;ans=q.m}
 const ds=[...new Set(cand.map(key).filter(x=>x!=ans))].slice(0,3);opts=shuf([ans,...ds]);

 document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
  const ok=b.textContent==ans;if(ok)sc++;
  document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent==ans)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  $("msg").textContent=ok?"✔ ¡Correcto!":"✘ Incorrecto. Respuesta correcta: "+ans;$("msg").style.color=ok?"var(--ok)":"var(--bad)";
  $("nt").innerHTML=JW(q.n);$("nx").hidden=false;$("nx").textContent=i+1<Q.length?"Siguiente":"Ver puntaje";
  $("nx").onclick=()=>{i++;i<Q.length?ask():end()};
 });
}

 $("quiz").innerHTML=`<div class="sun">${sc}</div><h2>Puntaje: ${sc} / ${Q.length}</h2><button class="q" id="bk">Volver a las tarjetas</button>`;

}
